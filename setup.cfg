[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist
per-file-ignores =
    # import after monkey_patch() is intentional
    plugin_upload.py: E402, E501
    # Sphinx conf may have long lines
    help/source/conf.py: E501
    # Tests often have long lines
    test/*: E501
    # Expression definitions and dialog texts may exceed 88 chars
    slope_expressions.py: E501
    slope_generator_dialog.py: E501

